<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- The hero's signal field as a mark: three threads converging on the
       ledger, one settled line leaving. Follows the browser's colour scheme. -->
  <style>
    .thread { fill: none; stroke: #1b2440; stroke-width: 2.4; stroke-linecap: round; }
    .settled { fill: none; stroke: #2f5bd3; stroke-width: 2.4; stroke-linecap: round; }
    .ledger { fill: #2f5bd3; }
    @media (prefers-color-scheme: dark) {
      .thread { stroke: #e4e8f1; }
      .settled { stroke: #7fa2ff; }
      .ledger { fill: #7fa2ff; }
    }
  </style>
  <path class="thread" d="M3 6.5C12 6.5 13 16 19.5 16M3 16H19.5M3 25.5C12 25.5 13 16 19.5 16" />
  <path class="settled" d="M22 16H29.5" />
  <circle class="ledger" cx="21" cy="16" r="3.6" />
</svg>
