<!doctype html>
<!--
  Source for the static brand images in public/. Regenerate by hand when the
  headline or the mark changes:

    python3 -m http.server 8000          # from the repo root
    open http://localhost:8000/scripts/brand/og-card.html
    screenshot #card at device scale 1   -> public/og.png        (1200x630)
    screenshot #icon at 512, 192 and 180 -> public/icon-512.png, icon-192.png,
                                            apple-touch-icon.png
    public/favicon.ico is the 32px mark, light colours, from favicon.svg.

  Fonts load from node_modules so the card uses the site's IBM Plex files.
-->
<html lang="en">
<head>
<meta charset="utf-8" />
<style>
  @font-face { font-family: "Plex"; font-weight: 500; src: url("../../node_modules/@fontsource/ibm-plex-sans/files/ibm-plex-sans-latin-500-normal.woff2") format("woff2"); }
  @font-face { font-family: "Plex"; font-weight: 600; src: url("../../node_modules/@fontsource/ibm-plex-sans/files/ibm-plex-sans-latin-600-normal.woff2") format("woff2"); }
  @font-face { font-family: "Plex"; font-weight: 400; src: url("../../node_modules/@fontsource/ibm-plex-sans/files/ibm-plex-sans-latin-400-normal.woff2") format("woff2"); }
  body { margin: 0; background: #ccc; }
  #card {
    box-sizing: border-box; width: 1200px; height: 630px; padding: 72px 80px;
    display: flex; flex-direction: column; justify-content: space-between;
    background: #f5f6f8; color: #1b2440; font-family: "Plex", sans-serif;
  }
  #card h1 { margin: 0; font-size: 56px; font-weight: 500; line-height: 1.12; letter-spacing: -0.015em; max-width: 27ch; text-wrap: balance; }
  .signal { display: block; width: 100%; height: 150px; overflow: visible; }
  footer { display: flex; justify-content: space-between; font-size: 26px; }
  footer strong { font-weight: 600; }
  footer span { color: #596079; }
  #icon { width: 512px; height: 512px; display: grid; place-items: center; background: #0f1420; }
</style>
</head>
<body>
  <div id="card">
    <h1>A message leaves one system, crosses three more, and still balances at the end.</h1>
    <svg class="signal" viewBox="0 0 1040 150" preserveAspectRatio="xMinYMid meet">
      <g fill="none" stroke="#a9b0c2" stroke-width="2">
        <path d="M0 10 C 380 10, 420 75, 640 75" />
        <path d="M0 45 C 380 45, 420 75, 640 75" />
        <path d="M0 105 C 380 105, 420 75, 640 75" />
        <path d="M0 140 C 380 140, 420 75, 640 75" />
      </g>
      <path d="M640 75 H1040" stroke="#2f5bd3" stroke-width="3" fill="none" />
      <circle cx="640" cy="75" r="40" fill="#2f5bd3" opacity="0.12" />
      <circle cx="640" cy="75" r="11" fill="#fff" stroke="#2f5bd3" stroke-width="3" />
      <text x="640" y="34" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="24" fill="#2f5bd3">Δ 0.00</text>
    </svg>
    <footer><strong>Najmi, backend &amp; integration engineer</strong><span>naohr.site</span></footer>
  </div>

  <div id="icon">
    <svg viewBox="0 0 32 32" width="360" height="360">
      <path d="M3 6.5C12 6.5 13 16 19.5 16M3 16H19.5M3 25.5C12 25.5 13 16 19.5 16" fill="none" stroke="#e4e8f1" stroke-width="2.4" stroke-linecap="round" />
      <path d="M22 16H29.5" fill="none" stroke="#7fa2ff" stroke-width="2.4" stroke-linecap="round" />
      <circle cx="21" cy="16" r="3.6" fill="#7fa2ff" />
    </svg>
  </div>
</body>
</html>
